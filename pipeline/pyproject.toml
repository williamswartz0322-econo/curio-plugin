[project]
name = "curio-pipeline"
version = "0.1.0"
description = "Curio ingestion pipeline: PDF textbook -> structured course content (deterministic half)"
requires-python = ">=3.11"
dependencies = [
    "pymupdf>=1.24",
    "pydantic>=2.7",
]

[project.scripts]
curio = "curio_pipeline.cli:main"

[dependency-groups]
test = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/curio_pipeline"]
